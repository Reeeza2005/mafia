    <script>
      // Suppress Vite HMR WebSocket errors in cloud/iframe environments where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (
          (reason && reason.message && /websocket|failed to fetch|without opened/i.test(reason.message)) ||
          (typeof reason === 'string' && /websocket/i.test(reason)) ||
          (reason && reason.stack && /@vite\/client/i.test(reason.stack))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && /websocket|failed to fetch|without opened/i.test(event.message)) ||
          (event.filename && /@vite\/client/i.test(event.filename))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <script>
      // Fallback for uncompiled GitHub Pages static branch deployment
      document.addEventListener('DOMContentLoaded', function() {
        var uncompiledScript = document.querySelector('script[src*="main.tsx"]');
        if (uncompiledScript && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs/')) {
          var fallback = document.getElementById('gh-fallback');
          if (fallback) fallback.style.display = 'block';
          try {
            var cleanPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
            window.location.replace(cleanPath + '/docs/' + window.location.search + window.location.hash);
          } catch (e) {}
        }
      });
    </script>
